   <div class="calculator-container">
            <h1 class="calculator-title">Tokyo Cars Calculator</h1>
            <p class="calculator-description">Calculator to calculate simple maths problem</p>
            
            <div class="calculator">
                <input type="text" class="calculator-display" id="display" readonly>
                
                <div class="calculator-buttons">
                    <button class="calculator-btn clear-btn" onclick="clearDisplay()">C</button>
                    <button class="calculator-btn clear-btn" onclick="deleteLast()">⌫</button>
                    <button class="calculator-btn operation-btn" onclick="appendToDisplay('/')">÷</button>
                    <button class="calculator-btn operation-btn" onclick="appendToDisplay('*')">×</button>
                    
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('7')">7</button>
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('8')">8</button>
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('9')">9</button>
                    <button class="calculator-btn operation-btn" onclick="appendToDisplay('-')">-</button>
                    
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('4')">4</button>
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('5')">5</button>
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('6')">6</button>
                    <button class="calculator-btn operation-btn" onclick="appendToDisplay('+')">+</button>
                    
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('1')">1</button>
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('2')">2</button>
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('3')">3</button>
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('0')">0</button>
                    
                    <button class="calculator-btn number-btn" onclick="appendToDisplay('.')">.</button>
                    <button class="calculator-btn equals-btn" onclick="calculateResult()">=</button>
                </div>
                
            </div>
        </div>
    </div>
